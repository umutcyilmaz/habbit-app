appId: com.umutcyilmaz.bloom.e2e
---
- scrollUntilVisible:
    element:
      id: "bloom.quiz.answer.never"
    direction: UP
    timeout: 20000

- tapOn:
    id: "bloom.quiz.answer.never"

- scrollUntilVisible:
    element:
      id: "bloom.quiz.continue"
    direction: DOWN
    timeout: 20000

- tapOn:
    id: "bloom.quiz.continue"
