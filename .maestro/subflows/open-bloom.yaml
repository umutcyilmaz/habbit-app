appId: com.umutcyilmaz.bloom.e2e
---
- runFlow:
    when:
      true: ${CLEAR_STATE == 'true'}
    commands:
      - launchApp:
          clearState: true

- runFlow:
    when:
      true: ${CLEAR_STATE != 'true'}
    commands:
      - launchApp

- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"

- runFlow:
    when:
      true: ${CLEAR_STATE == 'true'}
    commands:
      - extendedWaitUntil:
          visible: "Development Servers"
          timeout: 30000

- runFlow:
    when:
      visible: "Development Servers"
    commands:
      - extendedWaitUntil:
          visible:
            text: '^http://(?:localhost|[0-9]{1,3}(?:\.[0-9]{1,3}){3}):8082$'
          timeout: 30000
      - runFlow:
          when:
            visible:
              text: '^http://localhost:8082$'
          commands:
            - tapOn:
                text: '^http://localhost:8082$'
      - runFlow:
          when:
            visible:
              text: '^http://[0-9]{1,3}(?:\.[0-9]{1,3}){3}:8082$'
          commands:
            - tapOn:
                text: '^http://[0-9]{1,3}(?:\.[0-9]{1,3}){3}:8082$'
      - extendedWaitUntil:
          visible:
            text: '^Connected to:(?:,\s*|\s+)http://(?:localhost|[0-9]{1,3}(?:\.[0-9]{1,3}){3}):8082$'
          timeout: 60000
      - tapOn: "Close"

- runFlow:
    when:
      visible:
        text: '^Connected to:(?:,\s*|\s+)http://(?:localhost|[0-9]{1,3}(?:\.[0-9]{1,3}){3}):8082$'
    commands:
      - tapOn: "Close"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- extendedWaitUntil:
    visible:
      id: "${READY_ID}"
    timeout: 90000
