appId: com.umutcyilmaz.bloom.e2e
---
- scrollUntilVisible:
    element:
      id: "bloom.persistence.confirm-current"
    direction: UP
- assertNotVisible:
    id: "${RETRY_ID}"
- scrollUntilVisible:
    element:
      id: "${CLOSE_ID}"
    direction: UP
- assertVisible:
    id: "${CLOSE_ID}"
    enabled: false
- tapOn:
    id: "${CLOSE_ID}"
- swipe:
    start: "1%, 50%"
    end: "95%, 50%"
    duration: 600
- assertVisible:
    id: "${SCREEN_ID}"
- scrollUntilVisible:
    element:
      id: "bloom.persistence.confirm-current"
    direction: DOWN
- takeScreenshot: "phase11-${CASE}-obsolete-receipt"
- tapOn:
    id: "bloom.persistence.confirm-current"
- extendedWaitUntil:
    visible:
      id: "${CLOSE_ID}"
      enabled: true
    timeout: 30000
- assertVisible:
    id: "${SCREEN_ID}"
- assertNotVisible:
    id: "bloom.persistence.confirm-current"
- takeScreenshot: "phase11-${CASE}-current-confirmed"
- tapOn:
    id: "${CLOSE_ID}"
- extendedWaitUntil:
    visible:
      id: "bloom.home"
    timeout: 30000
