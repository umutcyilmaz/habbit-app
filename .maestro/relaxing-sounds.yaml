- tapOn: { id: "sound.back" }
- assertVisible: { id: "bloom.library" }
- tapOn: { id: "library.sound.ocean" }
- assertVisible: "Oynatmaya hazır"
- assertVisible: "0:00"
- runScript: library-transition-settle.js
- tapOn: { id: "sound.back" }
