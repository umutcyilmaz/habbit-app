appId: com.umutcyilmaz.bloom.e2e
name: Relaxing sounds real native engine and ephemeral lifecycle
---
# Requires isolated Kegel QA namespace AND EXPO_PUBLIC_RELAXING_SOUNDS_QA=1.
# No clearState, reset, migration change, or normal Bloom app access.
- openLink: "tms-e2e:///library"
- assertVisible: { id: "bloom.library" }
- scrollUntilVisible:
    element: { id: "library.sound.ocean" }
    direction: DOWN
    centerElement: true
- takeScreenshot: "01-native-library-sounds"
- tapOn: { id: "library.sound.ocean" }
- assertVisible: "Okyanus"
- assertVisible: "Oynatmaya hazır"
- takeScreenshot: "02-native-ocean"
- tapOn: { id: "sound.play" }
- assertVisible: "Çalıyor"
- tapOn: { id: "sound.duration.1200" }
- assertVisible: "20 dk"
- tapOn: { id: "sound.duration.1800" }
- tapOn: { id: "sound.duration.0" }
- assertVisible: "Sınırsız"
- tapOn: { id: "sound.forward" }
- assertVisible: "Çalıyor"
- tapOn: { id: "sound.rewind" }
