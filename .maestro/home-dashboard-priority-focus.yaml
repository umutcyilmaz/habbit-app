appId: com.umutcyilmaz.bloom.e2e
name: Priority Home focus after returning from scrolled Urge entry
---
# Only this phase's dedicated completion run after accepted 15-day continuation.
- openLink: "tms-e2e:///today"
- scrollUntilVisible:
    element: { id: "bloom.home.panic" }
    direction: DOWN
    centerElement: true
- tapOn: { id: "bloom.home.panic" }
- scrollUntilVisible:
    element: { id: "bloom.panic.triggered" }
    direction: DOWN
    centerElement: true
- tapOn: { id: "bloom.panic.triggered" }
- assertVisible: { id: "bloom.urge.exercise.ready" }
- tapOn: { id: "bloom.urge.exercise.exit" }
- assertVisible: { id: "bloom.urge.exercise.exit.dialog" }
- tapOn: { id: "bloom.urge.exercise.exit.confirm" }
- assertVisible: { id: "bloom.home" }
# No scroll: the real pending action must already be visible on focus.
- assertVisible: "Devam eden dürtü kontrolü"
- assertVisible: { id: "bloom.home.primary.action" }
- waitForAnimationToEnd: { timeout: 1500 }
- assertNotVisible: "Refreshing.*"
- takeScreenshot: "23-native-priority-focus"
- tapOn: { id: "bloom.home.primary.action" }
- scrollUntilVisible:
    element: { id: "bloom.urge.exercise.evaluate" }
    direction: DOWN
    centerElement: true
- tapOn: { id: "bloom.urge.exercise.evaluate" }
- scrollUntilVisible:
    element: { id: "bloom.urge.outcome.reduced" }
    direction: DOWN
    centerElement: true
- tapOn: { id: "bloom.urge.outcome.reduced" }
- scrollUntilVisible:
    element: { id: "bloom.urge.triggers.skip" }
    direction: DOWN
    centerElement: true
- tapOn: { id: "bloom.urge.triggers.skip" }
- scrollUntilVisible:
    element: { id: "bloom.urge.complete" }
    direction: DOWN
    centerElement: true
- tapOn: { id: "bloom.urge.complete" }
- assertVisible: { id: "bloom.home" }
- assertNotVisible: "Devam eden dürtü kontrolü"
