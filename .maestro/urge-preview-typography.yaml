appId: com.umutcyilmaz.bloom.e2e
name: Urge preview accessible typography
---
- openLink: "tms-e2e:///debug/urge-control"
- assertVisible: {id: "urge.preview.ready"}
- tapOn: {id: "urge.preview.exit"}
- openLink: "tms-e2e:///debug/urge-control"
- assertVisible: {id: "urge.preview.ready"}
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "ready-top"
- scrollUntilVisible:
    element: {id: "urge.preview.duration.20"}
    centerElement: false
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "ready-presets"
- tapOn: {id: "urge.preview.duration.20"}
- scrollUntilVisible:
    element: {id: "urge.preview.start"}
    centerElement: false
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "ready-start"
- scrollUntilVisible:
    element: {id: "urge.preview.intro.prose"}
    visibilityPercentage: 30
    centerElement: false
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "ready-prose"
- scrollUntilVisible:
    element: {id: "urge.preview.intro.guide"}
    visibilityPercentage: 30
    centerElement: false
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "ready-guide"
- scrollUntilVisible:
    element: {id: "urge.preview.start"}
    direction: UP
    centerElement: false
- tapOn: {id: "urge.preview.start"}
- assertVisible: {id: "urge.preview.running"}
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "running-top"
- scrollUntilVisible:
    element: {id: "urge.preview.pause"}
    centerElement: false
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "running-actions"
- tapOn: {id: "urge.preview.pause"}
- runFlow:
    when:
      visible: {id: "urge.preview.pause"}
    commands:
      - tapOn: {id: "urge.preview.pause"}
- assertVisible: {id: "urge.preview.paused"}
- scrollUntilVisible:
    element: {id: "urge.preview.resume"}
    centerElement: false
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "paused-actions"
- tapOn: {id: "urge.preview.finish"}
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "exit-top"
- scrollUntilVisible:
    element: {id: "urge.preview.exit.keep"}
    centerElement: false
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "exit-actions"
- tapOn: {id: "urge.preview.exit.keep"}
- scrollUntilVisible:
    element: {id: "urge.preview.resume"}
    centerElement: false
- tapOn: {id: "urge.preview.resume"}
- assertVisible: {id: "urge.preview.running"}
- tapOn: {id: "urge.preview.exit"}
- scrollUntilVisible:
    element: {id: "urge.preview.exit.confirm"}
    centerElement: false
- tapOn: {id: "urge.preview.exit.confirm"}
- openLink: "tms-e2e:///debug/urge-control?fixture=completion"
- scrollUntilVisible:
    element: {id: "urge.preview.start"}
    centerElement: false
- tapOn: {id: "urge.preview.start"}
- extendedWaitUntil:
    visible: {id: "urge.preview.completed"}
    timeout: 10000
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "completed-top"
- scrollUntilVisible:
    element: {id: "urge.preview.done"}
    centerElement: false
- waitForAnimationToEnd: {timeout: 1200}
- takeScreenshot: "completed-actions"
- tapOn: {id: "urge.preview.done"}
